apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  selector: {app: queue-api}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: queue-api}
  template:
    metadata:
      labels: {app: queue-api, metrics-role: api}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      securityContext: {runAsUser: 10001, runAsNonRoot: true}
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: migrate
          image: distributed-queue:local
          imagePullPolicy: IfNotPresent
          command: [/app/migrate]
          envFrom: [{secretRef: {name: queue-database}}]
      containers:
        - name: api
          image: distributed-queue:local
          imagePullPolicy: IfNotPresent
          command: [/app/api]
          envFrom: [{secretRef: {name: queue-database}}]
          env: [{name: REDIS_ADDR, value: "redis:6379"}]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker}
spec:
  replicas: 3
  selector:
    matchLabels: {app: queue-worker}
  template:
    metadata:
      labels: {app: queue-worker, metrics-role: workers}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9091"}
    spec:
      securityContext: {runAsUser: 10001, runAsNonRoot: true}
      terminationGracePeriodSeconds: 40
      initContainers:
        - name: migrate
          image: distributed-queue:local
          imagePullPolicy: IfNotPresent
          command: [/app/migrate]
          envFrom: [{secretRef: {name: queue-database}}]
      containers:
        - name: worker
          image: distributed-queue:local
          imagePullPolicy: IfNotPresent
          command: [/app/worker]
          envFrom: [{secretRef: {name: queue-database}}]
          env: [{name: REDIS_ADDR, value: "redis:6379"}]
          ports: [{name: metrics, containerPort: 9091}]
          readinessProbe:
            httpGet: {path: /ready, port: metrics}
            periodSeconds: 5
            timeoutSeconds: 4
          livenessProbe:
            httpGet: {path: /health, port: metrics}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
